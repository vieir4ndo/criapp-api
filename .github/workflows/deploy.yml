name: Build, Test & Deploy

on:
  push:
    branches:
      - main

env:
  DOTNET_SDK_VERSION: "8.0.x"
  BUILD_CONFIGURATION: Release
  AZURE_WEBAPP_NAME: criapp-api

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run tests
        run: dotnet test --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Publish
        run: dotnet publish src/CRIApp.Api/CRIApp.Api.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: criapp-api
          path: ./publish

  migrate:
    name: Run database migrations
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef

      - name: Run migrations
        run: dotnet ef database update --project src/CRIApp.Repository/CRIApp.Repository.csproj --startup-project src/CRIApp.Api/CRIApp.Api.csproj
        env:
          ConnectionStrings__Postgres: ${{ secrets.NEON_CONNECTION_STRING }}

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: migrate
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: criapp-api
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D7A65A256C5C4879AE1C0F6FB6CDAA15 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AA9102E7946C45A2803F262355DB3762 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_170B787C6BFA484BA141EF78B8656A69 }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish
